# Apple app pull request gate (docs/apple/adr/0013-ci-pr-gate.md).
# Every job only calls a target of apple-src/Makefile.
# Runs on every pull request so the required checks always report; the Apple
# jobs are skipped (reported as successful) when no Apple port path changed
# (docs/apple/adr/0017-ci-change-detection.md).
name: Apple CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apple-src

env:
  BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  # Check the PR head, not GitHub's synthetic merge commit.
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.detect.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: echo "apple=$(make changed BASE="$BASE" HEAD_REF="$HEAD_REF")" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: make lint

  privacy:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check files and commit metadata
        run: make privacy BASE="$BASE" HEAD_REF="$HEAD_REF"

  test:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: make coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apple-src/.build/**/codecov/*.json
          if-no-files-found: ignore

  ios-build:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: make ios-build
