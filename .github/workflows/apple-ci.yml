# Apple app pull request gate (docs/apple/adr/0013-ci-pr-gate.md).
# Every job only calls a target of apple-src/Makefile.
# Runs on every pull request so the required checks always report; the Apple
# jobs are skipped (reported as successful) when no Apple port path changed,
# and the build and test jobs also when only documentation changed
# (docs/apple/adr/0017-ci-change-detection.md, 0078-ci-skips-builds-for-docs.md).
# A draft pull request skips the app build, the iOS build and the UI tests; marking it
# ready for review runs them (docs/apple/adr/0079-ci-skips-long-jobs-for-drafts.md).
name: Apple CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A new push to a pull request cancels its run before; a run on main is let finish, as each merge is worth a complete
# result (docs/apple/adr/0079-ci-skips-long-jobs-for-drafts.md).
concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: apple-src

env:
  BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  # Check the PR head, not GitHub's synthetic merge commit.
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.detect.outputs.apple }}
      vectors: ${{ steps.detect.outputs.vectors }}
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          echo "apple=$(make changed BASE="$BASE" HEAD_REF="$HEAD_REF")" >> "$GITHUB_OUTPUT"
          echo "vectors=$(make changed BASE="$BASE" HEAD_REF="$HEAD_REF" ORACLE=--oracle CODE=--code)" >> "$GITHUB_OUTPUT"
          echo "code=$(make changed BASE="$BASE" HEAD_REF="$HEAD_REF" CODE=--code)" >> "$GITHUB_OUTPUT"

  vectors:
    needs: changes
    # Also runs when the Android sources the vectors are generated from change.
    if: needs.changes.outputs.vectors == 'true'
    # macOS: the Codec2 vectors are built with Apple clang on arm64, like the tests (ADR-0027).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: tools/test-vectors/*.gradle
      - run: make vectors-check JAVA17_HOME="$JAVA_HOME"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: make lint

  privacy:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check files and commit metadata
        run: make privacy BASE="$BASE" HEAD_REF="$HEAD_REF"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: make coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apple-src/.build/**/codecov/*.json
          if-no-files-found: ignore

  ios-build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: make ios-build

  app:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: make app

  # The website builds and its links lead somewhere (ADR-0067); apple-pages.yml publishes it from main.
  site:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make site-tools
      - run: make site-check

  # The UI tests, one device and one selection per job, side by side (ADR-0072): the functional tests, and Apple's
  # accessibility audit (ADR-0062), whose findings are kept; only a run that cannot go through the screens fails. One
  # simulator per machine, as several at once made the test runner time out and crash.
  ui-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    name: ui-tests (${{ matrix.device }}, ${{ matrix.tests }})
    strategy:
      fail-fast: false
      matrix:
        # "Mac" runs the app itself, on the runner's own desktop rather than in a simulator.
        device: [iPhone 18 Pro, iPad Pro 11-inch (M5), iPhone Duo, Mac]
        # The audit in two parts, each a job of its own: a retry then runs one part only.
        tests: [functional, audit-pages, audit-settings]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: make a11y A11Y_DEVICES="$DEVICE" UI_TESTS="$TESTS"
        working-directory: apple-src
        env:
          DEVICE: ${{ matrix.device }}
          TESTS: ${{ matrix.tests }}
      # The findings, the log of the run and a screenshot of each screen, to see why a run failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tests ${{ matrix.device }} ${{ matrix.tests }}
          path: |
            apple-src/.build/a11y/findings.txt
            apple-src/.build/a11y/*.log
            apple-src/.build/a11y/runs/*/*screenshots/
      # The result bundles of a run that failed, with the crash reports and diagnostics of a test runner that exited in
      # the middle of a test; up to some 170 MB each, so only then, and not kept long.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-tests ${{ matrix.device }} ${{ matrix.tests }} results
          path: apple-src/.build/a11y/runs/*/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
